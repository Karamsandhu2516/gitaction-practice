name: Python Code Quality Check

# 1. Trigger: When should this run?
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 2. Jobs: What should the "robot" do?
jobs:
  test-logic:
    runs-on: ubuntu-latest  # This spins up a fresh Ubuntu VM

    steps:
      # Step 1: Clone your code onto the VM
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up future runs

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run a simple check (Linting)
      - name: Run a basic syntax check
        run: python -m compileall app.py